    - paragraph [ref=e68]: 가족 모두가 일자리를 구하지 못해 앞날이 막막한 기택의 집에, 장남 기우를 위한 고액 과외 제안이 들어온다. 명문대생 친구가 연결해 준 자리인 만큼, 기우에게는 오랜만에 찾아온 고정수입의 기회이자 가족의 기대를 짊어진 일이다. 온 가족의 도움을 받고 박 사장의 저택으로 향한 그는, 살던 곳과 전혀 다른 풍요롭고 정돈된 공간을 마주한다. 집주인의 아내 연교와 가정부 문광의 안내를 받은 기우는 딸 다혜의 수업을 시작하며 새로운 집안의 일상에 조심스레 들어간다. 과외가 순조롭게 진행되자 어렵게 열린 기회를 놓치고 싶지 않은 마음은 커지고, 두 가족의 생활은 조금씩 맞닿기 시작한다. 서로에게 필요한 것을 채워줄 듯한 이 만남은, 처음에는 보이지 않던 차이와 욕망을 드러내는데...
